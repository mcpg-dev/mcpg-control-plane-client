[package]
name = "mcpg-control-plane-client"
version = "0.1.0-beta.13"
edition = "2024"
license = "Apache-2.0"
description = "MCPG control-plane client library: connects a gateway to a Control Plane. Library, not a registered MCPG plugin — consumed by `apps/gateway` (feature-gated) and `apps/control-plane/{ctl,server}` directly."

[lib]
crate-type = ["lib"]

[dependencies]
mcpg-control-plane-core = { git = "https://github.com/mcpg-dev/mcpg-control-plane-core", tag = "v0.1.0-beta.13", version = "=0.1.0-beta.13" }

# Async + errors
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
futures = "0.3"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# gRPC client (calls into CP)
tonic = { version = "0.12", features = ["transport", "tls"] }
prost = "0.13"
prost-types = "0.13"
tokio-stream = "0.1"

# Time + IDs
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
humantime = "2"

# Random + jitter for backoff
rand = "0.8"

# LKG cache base64 encoding
base64 = "0.22"

# LKG cache at-rest encryption (AES-256-GCM, machine-id-derived key)
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"

# Metrics buffer — short-critical-section locks. parking_lot's
# Mutex is significantly faster than std for the high-frequency
# tool-call dispatch path.
parking_lot = "0.12"

# Error message hashing for the metrics ship path (BLAKE3, no
# plaintext on the wire).
blake3 = "1"

# Lock-free hot-path state for quota status (read by gateway
# dispatch on every tool call, written by cp-client on heartbeat
# replies + ServerMessage pushes).
arc-swap = "1"

[dev-dependencies]
tempfile = "3"
